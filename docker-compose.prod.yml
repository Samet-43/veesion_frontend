version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: veesion_frontend_prod
    restart: unless-stopped
    networks:
      - web
    labels:
      # Traefik configuration - Remplacer your-domain.com par votre domaine réel
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

      # Middleware pour la sécurité
      - "traefik.http.routers.frontend.middlewares=security-headers@file"

      # Health check
      - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.timeout=10s"

    environment:
      - NODE_ENV=production

    # Resource limits optimisés pour la production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    external: true
    name: web
