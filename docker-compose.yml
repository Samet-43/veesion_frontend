version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veesion_frontend
    restart: unless-stopped
    networks:
      - web
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

      # Dokploy specific labels (optionnel)
      - "dokploy.name=veesion-frontend"
      - "dokploy.description=Veesion Frontend Application"
      - "dokploy.restartPolicy=unless-stopped"

      # Health check
      - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.timeout=10s"

    # Environment variables
    environment:
      - NODE_ENV=production

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

networks:
  web:
    external: true
    name: web
